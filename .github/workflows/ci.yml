name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Requires GitHub-hosted macOS runners. This is a SwiftUI/AppKit menu bar app;
# ubuntu/windows cannot xcodebuild it, and this job does not launch the GUI.
jobs:
  build:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Build Debug
        run: |
          xcodebuild -project CodeBar.xcodeproj \
            -scheme CodeBar \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/ci \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Run behavior tests
        run: CONFIGURATION=Debug CodeBarTests/run_module_behavior_tests.sh
